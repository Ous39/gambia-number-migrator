name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @gnm/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r test

      - name: Build (api, admin, web, mobile)
        run: pnpm -r --filter "!@gnm/shared" build
