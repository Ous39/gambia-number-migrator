# Example HOST-level Nginx reverse proxy for the Ubuntu VPS.
# This runs outside Docker and is the only public entry point in front of the
# docker-compose.production.yml stack, which binds the API and Admin
# containers to 127.0.0.1 only. Install with Certbot (certbot --nginx) so it
# can provision and auto-renew the certificates referenced below.
#
# Copy this file to /etc/nginx/sites-available/gnm.conf, adjust the
# server_name values and certificate paths for your domains, then:
#   ln -s /etc/nginx/sites-available/gnm.conf /etc/nginx/sites-enabled/gnm.conf
#   nginx -t && systemctl reload nginx

# --- api.oceanbrown.gm -------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name api.oceanbrown.gm;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.oceanbrown.gm;

  ssl_certificate     /etc/letsencrypt/live/api.oceanbrown.gm/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.oceanbrown.gm/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Slightly above the API's own 1mb JSON body limit so Nginx never rejects a
  # request before Express's own validation gets to return a clean error.
  client_max_body_size 2m;
  client_body_timeout 15s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  location / {
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- admin.oceanbrown.gm ------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name admin.oceanbrown.gm;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.oceanbrown.gm;

  ssl_certificate     /etc/letsencrypt/live/admin.oceanbrown.gm/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.oceanbrown.gm/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 1m;
  proxy_connect_timeout 10s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # The admin container already serves its own production Vite build via the
  # internal deploy/nginx-admin.conf; this just forwards to that container.
  location / {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- gnm.oceanbrown.gm (public website) ---------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name gnm.oceanbrown.gm;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name gnm.oceanbrown.gm;

  ssl_certificate     /etc/letsencrypt/live/gnm.oceanbrown.gm/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gnm.oceanbrown.gm/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 1m;
  proxy_connect_timeout 10s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # The web container already serves its own production Vite build via the
  # internal deploy/nginx-web.conf; this just forwards to that container.
  location / {
    proxy_pass http://127.0.0.1:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
