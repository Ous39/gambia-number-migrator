server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 512;

  # TLS is terminated by the proxy in front; keep any redirect on the caller's
  # scheme/host instead of emitting an absolute http:// URL.
  absolute_redirect off;

  location / {
    # Pre-rendered routes are flat files (status.html, payment/success.html);
    # match those before the SPA fallback so /status serves directly with no
    # directory 301.
    try_files $uri $uri.html $uri/ /index.html;
  }

  # Vite-hashed bundles never change content — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Other static media (icons, screenshots, badges, fonts).
  location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }
}
