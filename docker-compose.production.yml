services:
  postgres:
    image: postgres:16-alpine
    container_name: gnm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gnm_production_data:/var/lib/postgresql/data
    networks:
      - gnm_backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    container_name: gnm_api
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:8089"
    networks:
      - gnm_backend
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8089/api/health >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  admin:
    container_name: gnm_admin
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_API_BASE_URL: https://api.oceanbrown.gm/api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - gnm_backend

networks:
  gnm_backend:
    name: gnm_backend

volumes:
  gnm_production_data:
    name: gnm_production_data
